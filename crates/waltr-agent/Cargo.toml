[package]
name = "waltr-agent"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["shell"]
shell = ["dep:tree-sitter", "dep:tree-sitter-bash"]

[dependencies]
aws-sdk-s3.workspace = true
futures-util.workspace = true
globset.workspace = true
http.workspace = true
ignore.workspace = true
opendal.workspace = true
refinery = { workspace = true, features = ["tokio-postgres"] }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
rmcp = { version = "1.7.0", default-features = false, features = ["macros", "server", "transport-io", "transport-streamable-http-server"] }
rustls.workspace = true
scylla.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-postgres.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tree-sitter = { version = "0.25", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
uuid = { workspace = true, features = ["v7"] }
webpki-roots.workspace = true

[dev-dependencies]
aws-config.workspace = true
axum.workspace = true
tempfile.workspace = true
testcontainers.workspace = true

[lints]
workspace = true
