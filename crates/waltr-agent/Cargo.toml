[package]
name = "waltr-agent"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["shell"]
shell = ["dep:tree-sitter", "dep:tree-sitter-bash", "waltr-agent-sandbox/shell"]

[dependencies]
aws-sdk-s3.workspace = true
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
http.workspace = true
httpdate.workspace = true
jsonwebtoken.workspace = true
waltr.workspace = true
mcp.workspace = true
opendal.workspace = true
oauth2.workspace = true
refinery = { workspace = true, features = ["tokio-postgres"] }
reqwest = { workspace = true, features = ["form", "json", "rustls", "stream"] }
rustls.workspace = true
scylla.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tracing.workspace = true
tree-sitter = { version = "0.25", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
uuid = { workspace = true, features = ["v7"] }
webpki-roots.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
aws-config.workspace = true
hyper-util.workspace = true
waltr-agent-sandbox = { path = "../waltr-agent-sandbox" }
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tempfile.workspace = true
testcontainers.workspace = true
tower.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
