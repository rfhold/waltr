[package]
name = "waltr-agent"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
shell = ["dep:tree-sitter", "dep:tree-sitter-bash"]

[dependencies]
futures-util.workspace = true
http.workspace = true
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
rmcp = { version = "1.7.0", default-features = false, features = ["macros", "server", "transport-io", "transport-streamable-http-server"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite.workspace = true
tree-sitter = { version = "0.25", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }

[dev-dependencies]
axum.workspace = true

[lints]
workspace = true
