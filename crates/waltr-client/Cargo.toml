[package]
name = "waltr-client"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
native-access = ["dep:base64", "dep:rand", "dep:reqwest", "dep:sha2", "dep:tokio"]
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures"]

[dependencies]
futures-channel.workspace = true
futures-core.workspace = true
futures-util.workspace = true
waltr = { path = "../waltr", version = "0.1.0", default-features = false, features = ["grpc"] }
prost-types.workspace = true
prost.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml_ng.workspace = true
tonic.workspace = true
ts-rs.workspace = true
url.workspace = true
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["form", "rustls"], optional = true }
rustls.workspace = true
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"], optional = true }
tonic = { workspace = true, features = ["transport", "tls-native-roots", "tls-ring"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tonic-web-wasm-client.workspace = true

[dev-dependencies]
hyper-util.workspace = true
waltr-agent.workspace = true
waltr-server = { workspace = true, features = ["test"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
