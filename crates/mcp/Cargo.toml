[package]
name = "mcp"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["macros"]
macros = ["dep:mcp-macros"]
oauth-authorization-server = ["dep:aes-gcm", "dep:p256", "dep:sha2", "dep:zeroize"]
oauth-authorization-server-postgres = ["oauth-authorization-server", "dep:sqlx", "sqlx/macros", "sqlx/migrate", "sqlx/postgres", "sqlx/runtime-tokio-rustls"]
oauth-authorization-server-sqlite = ["oauth-authorization-server", "dep:sqlx", "sqlx/macros", "sqlx/migrate", "sqlx/runtime-tokio", "sqlx/sqlite"]
progressive = ["macros", "dep:jaq-interpret", "dep:jaq-parse", "dep:schemars"]

[dependencies]
aes-gcm = { workspace = true, optional = true }
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
jaq-interpret = { workspace = true, optional = true }
jaq-parse = { workspace = true, optional = true }
mcp-macros = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
opentelemetry.workspace = true
p256 = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
url.workspace = true
zeroize = { workspace = true, optional = true }

[dev-dependencies]
rmcp = { version = "3.1.2", features = ["client", "reqwest", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
tempfile.workspace = true
testcontainers.workspace = true

[[test]]
name = "oauth_store"
path = "tests/oauth_store.rs"
required-features = ["oauth-authorization-server"]

[[test]]
name = "oauth_authorization_server"
path = "tests/oauth_authorization_server.rs"
required-features = ["oauth-authorization-server"]

[[test]]
name = "oauth_sqlite_store"
path = "tests/oauth_sqlite_store.rs"
required-features = ["oauth-authorization-server-sqlite"]

[[test]]
name = "oauth_postgres_store"
path = "tests/oauth_postgres_store.rs"
required-features = ["oauth-authorization-server-postgres"]

[[test]]
name = "progressive"
path = "tests/progressive.rs"
required-features = ["progressive"]

[lints]
workspace = true
