[package]
name = "waltr-tui"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "waltr"
path = "src/main.rs"

[features]
default = []
server = ["dep:waltr-server", "dep:tracing"]
web = ["server", "waltr-server/web"]
default-server = ["server"]
bundled-server = ["server", "default-server"]
bundled = ["web", "default-server"]

[dependencies]
base64.workspace = true
waltr-client.workspace = true
waltr-server = { workspace = true, optional = true }
pulldown-cmark.workspace = true
rand.workspace = true
ratatui = { workspace = true, features = ["palette", "scrolling-regions"] }
reqwest = { workspace = true, features = ["form", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
syntect.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
insta.workspace = true
waltr-server = { workspace = true, features = ["test"] }

[lints]
workspace = true
