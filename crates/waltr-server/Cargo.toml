[package]
name = "waltr-server"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["profiling", "shell"]
profiling = ["dep:pyroscope"]
shell = ["waltr-agent/shell"]
test = []
web = []

[dependencies]
aws-sdk-s3.workspace = true
axum.workspace = true
base64.workspace = true
cookie.workspace = true
waltr = { path = "../waltr", version = "0.1.0", default-features = false, features = ["grpc"] }
waltr-agent = { path = "../waltr-agent", version = "0.1.0", default-features = false }
futures-util.workspace = true
http-body.workspace = true
jsonwebtoken.workspace = true
jaq-core.workspace = true
jaq-interpret.workspace = true
jaq-parse.workspace = true
jaq-std.workspace = true
mcp = { workspace = true, features = ["oauth-authorization-server-postgres", "oauth-authorization-server-sqlite", "progressive"] }
oauth2.workspace = true
notify.workspace = true
p256.workspace = true
tokio-util.workspace = true
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
pyroscope = { workspace = true, optional = true }
rand.workspace = true
prost-types.workspace = true
prost.workspace = true
reqwest = { workspace = true, features = ["form", "json", "rustls"] }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls", "sqlite"] }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
tower.workspace = true
tower-http = { workspace = true, features = ["trace"] }
tonic.workspace = true
tonic-otel-layer.workspace = true
tonic-tracing-opentelemetry.workspace = true
tonic-web.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
testcontainers.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tonic = { workspace = true, features = ["transport"] }
