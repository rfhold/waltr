[package]
name = "waltr-server"
default-run = "waltr-server"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["profiling", "shell", "apps-assets"]
profiling = ["dep:pyroscope"]
shell = ["dep:tree-sitter", "dep:tree-sitter-bash", "waltr-agent-sandbox/shell"]
test = []
web = ["apps-assets"]
apps-assets = ["apps-host-assets", "apps-served-assets"]
apps-host-assets = []
apps-served-assets = []

[dependencies]
aws-sdk-s3.workspace = true
axum.workspace = true
base64.workspace = true
cookie.workspace = true
waltr = { path = "../waltr", version = "0.3.0", default-features = false, features = ["grpc"] }
waltr-agent = { path = "../waltr-agent", version = "0.3.0", default-features = false }
waltr-audio = { path = "../waltr-audio", version = "0.3.0" }
waltr-script = { path = "../waltr-script", version = "0.3.0" }
waltr-agent-sandbox = { path = "../waltr-agent-sandbox", version = "0.3.0", default-features = false, features = ["rpc"] }
futures-util.workspace = true
http-body.workspace = true
http.workspace = true
hyper-util = { workspace = true, features = ["server-auto", "service"] }
hyper = { version = "1.10.0", features = ["http2", "server"] }
jsonwebtoken.workspace = true
jaq-core.workspace = true
jaq-interpret.workspace = true
jaq-parse.workspace = true
jaq-std.workspace = true
mcp = { workspace = true, features = ["oauth-authorization-server-postgres", "oauth-authorization-server-sqlite", "progressive"] }
oauth2.workspace = true
notify.workspace = true
p256.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
pyroscope = { workspace = true, optional = true }
rand.workspace = true
prost-types.workspace = true
prost.workspace = true
reqwest = { workspace = true, features = ["form", "json", "rustls"] }
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls", "sqlite"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net", "sync"] }
tower.workspace = true
tower-http = { workspace = true, features = ["trace"] }
tonic.workspace = true
tonic-otel-layer.workspace = true
tonic-tracing-opentelemetry.workspace = true
tonic-web.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
tree-sitter = { version = "0.25", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
url.workspace = true
uuid = { workspace = true, features = ["v4", "v7"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(target_os = "android")'.dependencies]
rustls.workspace = true
webpki-roots.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
reqwest = { workspace = true, features = ["json", "http2"] }
testcontainers.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tonic = { workspace = true, features = ["transport"] }
