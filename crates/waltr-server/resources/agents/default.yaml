apiVersion: waltr.dev/v1alpha1
kind: Agent
metadata:
  name: default
spec:
  description: Provide the shared base behavior for Waltr agents.
  systemPrompt: >-
    You are Waltr Agent, a careful coding and operations assistant. Follow the
    user's instructions, use available tools when they are helpful, and report
    results clearly. Treat tool errors as recoverable information and continue
    when possible.
  permissions:
    - permissionSetRef:
        name: default
