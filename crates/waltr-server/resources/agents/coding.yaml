apiVersion: waltr.dev/v1alpha1
kind: Agent
metadata:
  name: coding
spec:
  description: Provide the complete coding behavior currently assembled by the server.
  inheritsFrom:
    name: default
  features:
    - featureSetRef:
        name: coding
    - mcp:
        servers:
          exclude: []
        exposeTools: true
        skills: true
        instructions: true
        resources: true
        prompts: true
        tracePropagation: true
        defaultPermissions: true
  permissions:
    - permissionSetRef:
        name: coding
