apiVersion: waltr.routine/v1
kind: Routine
name: audio-transcribe
description: Type the final transcript into the focused application through Computer Use.
spec:
  source: |
    export default async function () {
      const transcript = await host.call('media.collect', {port: 'audio', cap: 16384, speech: {from: 'defaults'}});
      const text = await host.call('media.readText', {max: 16384}, null, null, transcript);
      if (!text.trim()) throw new Error('no transcript to type');
      await host.call('media.finish', {});
      const typed = await host.call('tools.execute', {
        target: {server: 'computer-use', tool: 'type_text'},
        arguments: {text, allow_clipboard: false}, workspace: {machine: 'preview'}
      });
      if (typed.status !== 'completed' || typed.result?.is_error !== false) {
        throw new Error('Computer Use typing failed');
      }
      return {completed: true};
    }
  entrypoints:
    dictate:
      trigger: interactive
  parameters:
    schemaVersion: waltr.value/v1
    schema:
      type: object
      properties: {}
      required: []
  result:
    schemaVersion: waltr.value/v1
    schema:
      type: object
      properties:
        completed:
          type: boolean
      required:
      - completed
  capabilities:
  - media.execute
  - tools.execute
  mcpTools:
  - {server: computer-use, tool: type_text}
  budgets:
    valueBytes: 65536
    resultBytes: 65536
    hostCalls: 32
    inFlight: 4
    deadlineMs: 5400000
  ports:
    audio:
      direction: input
      media: audio
      required: true
      maxBytes: 268435456
      formats:
      - pcm16le-24000-mono
