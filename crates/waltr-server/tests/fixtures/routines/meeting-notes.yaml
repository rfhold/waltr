apiVersion: waltr.routine/v1
kind: Routine
name: meeting-notes
description: Unregistered diarized filtering, notes, and separate deletion audit
spec:
  source: |
    export default async function () {
      const transcript = await host.call('media.collect', {port: 'audio', cap: 262144, snapshot: true});
      const filtered = await host.call('helper.run', {selection: {kind: 'named', name: 'routine-conversation-filter'}, task: 'Filter the attached conversation, capturing retained_transcript and deleted_items separately.', capture: 'filtered-conversation', maxTurns: 3, deadlineMs: 120000, responseBytes: 65536, completionBytes: 4194304}, null, null, transcript);
      const retained = await host.call('media.select', {field: '/retained_transcript'}, null, null, filtered);
      const audit = await host.call('media.select', {field: '/deleted_items'}, null, null, filtered);
      const conversation = await host.call('media.select', {}, null, null, filtered);
      const helper = await host.call('helper.run', {selection: {kind: 'named', name: 'routine-conversation-notes'}, task: 'Write source-grounded notes from the attached retained_transcript and deleted_items. Capture final notes in chosen.', capture: 'conversation-notes', maxTurns: 3, deadlineMs: 120000, responseBytes: 65536, completionBytes: 4194304}, null, null, conversation);
      const notes = await host.call('media.select', {field: '/chosen'}, null, null, helper);
      await host.call('media.publish', {name: 'retained-transcript'}, null, null, retained);
      await host.call('media.publish', {name: 'notes'}, null, null, notes);
      await host.call('media.publish', {name: 'deletion-audit'}, null, null, audit);
      await host.call('media.emit', {output: 'notes'}, null, null, notes);
      await host.call('media.finish', {});
      return {completed: true};
    }
  entrypoints:
    dictate: {trigger: interactive}
  parameters: {schemaVersion: waltr.value/v1, schema: {type: object, properties: {}, required: []}}
  result: {schemaVersion: waltr.value/v1, schema: {type: object, properties: {completed: {type: boolean}}, required: [completed]}}
  capabilities: [media.execute, helper.run, helper.named.routine-conversation-filter, helper.named.routine-conversation-notes, helper.capture.filtered-conversation, helper.capture.conversation-notes]
  captures:
    filtered-conversation:
      selection: {kind: named, name: routine-conversation-filter}
      contract:
        schemaVersion: waltr.value/v1
        schema: {type: object, properties: {retained_transcript: {type: string, maxLength: 1048576}, deleted_items: {type: string, maxLength: 1048576}}, required: [retained_transcript, deleted_items]}
    conversation-notes:
      selection: {kind: named, name: routine-conversation-notes}
      contract:
        schemaVersion: waltr.value/v1
        schema: {type: object, properties: {chosen: {type: string, maxLength: 1048576}}, required: [chosen]}
  budgets: {valueBytes: 65536, resultBytes: 65536, hostCalls: 32, inFlight: 4, deadlineMs: 5400000}
  ports:
    audio: {direction: input, media: audio, required: true, maxBytes: 268435456, formats: [pcm16le-24000-mono]}
    notes: {direction: output, media: text, required: true, maxBytes: 1048576, formats: [utf8]}
