[package]
name = "waltr-agent-sandbox"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["rpc"]
rpc = []
shell = ["dep:tree-sitter", "dep:tree-sitter-bash"]

[[bin]]
name = "waltr-agent-sandbox"
path = "src/main.rs"
required-features = ["rpc"]

[dependencies]
globset.workspace = true
hyper-util.workspace = true
ignore.workspace = true
waltr.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream.workspace = true
tokio-util.workspace = true
tonic = { workspace = true, features = ["transport"] }
tower.workspace = true
tree-sitter = { version = "0.25", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
