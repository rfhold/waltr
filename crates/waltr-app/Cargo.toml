[package]
name = "waltr-app"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Waltr native desktop and Android shell"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rfhold/waltr"
build = "build.rs"

[lib]
name = "waltr_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "waltr-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.5.4", features = [] }

[dependencies]
arc-swap.workspace = true
async-trait = "0.1.89"
futures-channel.workspace = true
waltr-client = { workspace = true, features = ["native-access", "native-tracing"] }
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-http = "0.32.0"
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
reqwest = { workspace = true, features = ["blocking", "rustls-no-provider"] }
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tauri = { version = "=2.10.1", features = [] }
tauri-plugin-opener = "=2.5.0"
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
jni_fn = "0.1.2"

[lints]
workspace = true
