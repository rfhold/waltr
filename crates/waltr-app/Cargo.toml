[package]
name = "waltr-app"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Waltr native desktop and Android shell"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rfhold/waltr"
build = "build.rs"

[lib]
name = "waltr_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "waltr-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.5.4", features = [] }

[features]
native-apps-test = ["dep:axum", "dep:hyper", "dep:hyper-util"]

[dependencies]
async-trait = "0.1.89"
axum = { workspace = true, optional = true }
hyper = { version = "1.10.0", features = ["http1", "server"], optional = true }
hyper-util = { workspace = true, features = ["service"], optional = true }
futures-channel.workspace = true
waltr-client = { workspace = true, features = ["native-tracing"] }
waltr-server = { path = "../waltr-server", version = "0.1.0", default-features = false }
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-http = "0.32.0"
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
reqwest = { workspace = true, features = ["blocking", "rustls-no-provider"] }
rand.workspace = true
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tauri = { version = "=2.10.1", features = [] }
tauri-plugin-opener = "=2.5.0"
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tauri = { version = "=2.10.1", features = ["test"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
jni_fn = "0.1.2"
rustls-platform-verifier = "0.7.0"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
objc2 = { version = "=0.6.4" }
objc2-foundation = { version = "=0.3.2" }
objc2-web-kit = { version = "=0.3.2" }
block2 = { version = "=0.6.2" }
waltr-server = { path = "../waltr-server", version = "0.1.0", default-features = false, features = ["apps-host-assets", "apps-served-assets"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
waltr-server = { path = "../waltr-server", version = "0.1.0", default-features = false, features = ["shell"] }

[lints.rust]
# Mirror workspace lints, allowing only the macOS WK delegate module to opt into FFI.
# Other platforms additionally forbid unsafe code at the crate root.
deprecated_safe = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
keyword_idents = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
