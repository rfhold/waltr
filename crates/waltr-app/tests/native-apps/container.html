<!doctype html><html><head><meta charset="utf-8"><title>Native Attacker Fixtures</title></head>
<body><p>Outer loopback and opaque inner attacker fixtures. These deliberately permit IPC network attempts to test the native fence, unlike the production resource CSP.</p>
<pre id="results"></pre><script src="./probe.js"></script>
<iframe sandbox="allow-scripts" srcdoc="<!doctype html><meta charset='utf-8'><pre id='results'></pre><script src='./probe.js'></script>"></iframe>
<script>window.addEventListener('message', event => { if(event.source === document.querySelector('iframe').contentWindow && event.origin === 'null' && event.data?.type === 'waltr-ipc-probe') window.parent.postMessage(event.data, '*'); });</script>
</body></html>
