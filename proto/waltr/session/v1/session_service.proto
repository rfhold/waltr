syntax = "proto3";

package waltr.session.v1;

import "google/protobuf/timestamp.proto";
import "waltr/config/v1/config_service.proto";

service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc UpdateSessionRuntimeConfig(UpdateSessionRuntimeConfigRequest) returns (UpdateSessionRuntimeConfigResponse);
  rpc WatchSessions(WatchSessionsRequest) returns (stream WatchSessionsResponse);
  rpc GetTimeline(GetTimelineRequest) returns (GetTimelineResponse);
  rpc WatchTimeline(WatchTimelineRequest) returns (stream WatchTimelineResponse);
  rpc SubmitUserMessage(SubmitUserMessageRequest) returns (SubmitUserMessageResponse);
  rpc RespondExternalRequest(RespondExternalRequestRequest) returns (RespondExternalRequestResponse);
  rpc InterruptSession(InterruptSessionRequest) returns (InterruptSessionResponse);
  rpc RollbackSession(RollbackSessionRequest) returns (RollbackSessionResponse);
  rpc ContinueSession(ContinueSessionRequest) returns (ContinueSessionResponse);
}

message CreateSessionRequest {
  SessionRuntimeConfigRequest runtime_config = 1;
}

message CreateSessionResponse {
  SessionSummary session = 1;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
}

message DeleteSessionRequest {
  string id = 1;
}

message DeleteSessionResponse {}

message UpdateSessionRuntimeConfigRequest {
  string id = 1;
  SessionRuntimeConfigRequest runtime_config = 2;
}

message UpdateSessionRuntimeConfigResponse {
  SessionSummary session = 1;
}

message WatchSessionsRequest {}

message WatchSessionsResponse {
  uint64 sequence = 1;
  oneof event {
    SessionListSnapshot snapshot = 2;
    SessionSummary session = 3;
    string deleted_id = 4;
  }
}

message SessionListSnapshot {
  repeated SessionSummary sessions = 1;
}

message GetTimelineRequest {
  string session_id = 1;
  TimelineQuery query = 2;
}

message GetTimelineResponse {
  repeated TimelineEvent events = 1;
}

message WatchTimelineRequest {
  string session_id = 1;

  // Server emits persisted events after this cursor before switching to live updates.
  optional uint64 after_cursor = 2;

  // Optional live display-channel filter.
  repeated string channels = 3;

  // Optional backward history batch emitted before catch-up and live updates.
  optional uint32 initial_limit = 4;
}

message WatchTimelineResponse {
  uint64 sequence = 1;
  oneof update {
    TimelineEvent event = 2;
    TimelineTruncation truncation = 3;
  }
}

message TimelineTruncation {
  string session_id = 1;
  optional uint64 after_cursor = 2;
}

message SubmitUserMessageRequest {
  string session_id = 1;
  string text = 2;
}

message SubmitUserMessageResponse {}

message RespondExternalRequestRequest {
  string session_id = 1;
  string request_id = 2;

  // JSON payload encoded as UTF-8 JSON until response schemas stabilize.
  string response_json = 3;
}

message RespondExternalRequestResponse {}

message InterruptSessionRequest {
  string session_id = 1;
}

message InterruptSessionResponse {}

message RollbackSessionRequest {
  string session_id = 1;
  RollbackTarget target = 2;
}

message RollbackSessionResponse {
  SessionSummary session = 1;
  TimelineTruncation truncation = 2;
}

message ContinueSessionRequest {
  string session_id = 1;
  RollbackTarget target = 2;
}

message ContinueSessionResponse {}

message RollbackTarget {
  oneof target {
    uint64 turn = 1;
    uint64 cursor = 2;
    uint64 before_cursor = 3;
  }
}

message TimelineQuery {
  TimelineDirection direction = 1;

  // Exclusive cursor boundary.
  optional uint64 cursor = 2;

  uint32 limit = 3;
  repeated string channels = 4;
}

enum TimelineDirection {
  TIMELINE_DIRECTION_UNSPECIFIED = 0;
  TIMELINE_DIRECTION_FORWARD = 1;
  TIMELINE_DIRECTION_BACKWARD = 2;
}

message TimelineEvent {
  uint64 cursor = 1;
  string session_id = 2;
  uint64 turn = 3;
  string item_id = 4;
  optional string parent_id = 5;
  TimelineEventKind kind = 6;
  optional string channel = 7;
  TimelineContent content = 8;
  optional TimelineStatus status = 9;

  // JSON object encoded as UTF-8 JSON until metadata schemas stabilize.
  string metadata_json = 10;
}

enum TimelineEventKind {
  TIMELINE_EVENT_KIND_UNSPECIFIED = 0;
  TIMELINE_EVENT_KIND_ITEM_STARTED = 1;
  TIMELINE_EVENT_KIND_CONTENT_DELTA = 2;
  TIMELINE_EVENT_KIND_ITEM_UPDATED = 3;
  TIMELINE_EVENT_KIND_ITEM_FINISHED = 4;
  TIMELINE_EVENT_KIND_EXTERNAL_REQUEST_OPENED = 5;
  TIMELINE_EVENT_KIND_EXTERNAL_REQUEST_RESOLVED = 6;
  TIMELINE_EVENT_KIND_SESSION_STATUS_CHANGED = 7;
}

enum TimelineStatus {
  TIMELINE_STATUS_UNSPECIFIED = 0;
  TIMELINE_STATUS_IDLE = 1;
  TIMELINE_STATUS_BUILDING_REQUEST = 2;
  TIMELINE_STATUS_STREAMING_PROVIDER = 3;
  TIMELINE_STATUS_EVALUATING_TOOL_CALL = 4;
  TIMELINE_STATUS_RUNNING_TOOL = 5;
  TIMELINE_STATUS_PENDING = 6;
  TIMELINE_STATUS_AWAITING_TOOL_RESULTS = 7;
  TIMELINE_STATUS_AWAITING_EXTERNAL_INPUT = 8;
  TIMELINE_STATUS_INTERRUPTED = 9;
  TIMELINE_STATUS_RESOLVED = 10;
  TIMELINE_STATUS_FINISHED = 11;
  TIMELINE_STATUS_FAILED = 12;
  TIMELINE_STATUS_CANCELED = 13;
  TIMELINE_STATUS_RETRYING_PROVIDER = 14;
}

message TimelineContent {
  oneof content {
    EmptyTimelineContent empty = 1;
    TextDeltaTimelineContent text_delta = 2;
    TextSnapshotTimelineContent text_snapshot = 3;
    ToolCallTimelineContent tool_call = 4;
    ToolResultTimelineContent tool_result = 5;
    ExternalRequestTimelineContent external_request = 6;
    ContentRefTimelineContent content_ref = 7;
    JsonTimelineContent json = 8;
  }
}

message EmptyTimelineContent {}

message TextDeltaTimelineContent {
  string delta = 1;
}

message TextSnapshotTimelineContent {
  string text = 1;
}

message ToolCallTimelineContent {
  string id = 1;
  string name = 2;
  string arguments_json = 3;
}

message ToolResultTimelineContent {
  string id = 1;
  string name = 2;
  string content = 3;
  bool error = 4;
}

message ExternalRequestTimelineContent {
  ExternalRequest request = 1;
}

message ContentRefTimelineContent {
  string content_id = 1;
  uint64 bytes = 2;
}

message JsonTimelineContent {
  string value_json = 1;
}

message SessionSummary {
  string id = 1;
  uint64 revision = 2;
  SessionStatus status = 3;
  optional string current_prompt = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  google.protobuf.Timestamp last_activity_at = 7;
  SessionRuntimeConfig runtime_config = 8;
  SessionMetrics metrics = 9;
}

message SessionMetrics {
  // Non-cache/base-priced input tokens consumed by provider requests.
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cache_read_tokens = 3;
  uint64 cache_write_tokens = 4;
  uint64 image_input_tokens = 5;
  uint64 image_input_count = 6;
  uint64 total_tokens = 7;
  optional string cost_currency = 8;
  uint64 total_cost_micros = 9;
  uint64 total_input_tokens = 10;
  uint64 context_tokens = 11;
}

message SessionRuntimeConfig {
  SessionProviderRuntime provider = 1;
  repeated SessionMcpServerRuntime mcp_servers = 2;
}

message SessionRuntimeConfigRequest {
  string provider_key = 1;
  string model_id = 2;
  repeated string enabled_mcp_server_keys = 3;
  optional string reasoning_effort = 4;
}

message SessionProviderRuntime {
  string key = 1;
  waltr.config.v1.ProviderType type = 2;
  string url = 3;
  string model_id = 4;
  RuntimeConfigMatch match = 5;
  optional string reasoning_effort = 6;
}

message SessionMcpServerRuntime {
  string key = 1;
  waltr.config.v1.McpServerType type = 2;
  string command = 3;
  string url = 4;
  RuntimeConfigMatch match = 5;
}

enum RuntimeConfigMatch {
  RUNTIME_CONFIG_MATCH_UNSPECIFIED = 0;
  RUNTIME_CONFIG_MATCH_CONFIGURED = 1;
  RUNTIME_CONFIG_MATCH_MISSING = 2;
  RUNTIME_CONFIG_MATCH_CHANGED = 3;
}

message SessionStatus {
  SessionPhase phase = 1;

  // Set when phase == SESSION_PHASE_SUSPENDED.
  Suspension suspension = 2;

  // Set when phase == SESSION_PHASE_FAILED.
  string failed_message = 3;
}

enum SessionPhase {
  SESSION_PHASE_UNSPECIFIED = 0;
  SESSION_PHASE_IDLE = 1;
  SESSION_PHASE_BUILDING_REQUEST = 2;
  SESSION_PHASE_STREAMING_PROVIDER = 3;
  SESSION_PHASE_EVALUATING_TOOL_CALL = 4;
  SESSION_PHASE_RUNNING_TOOL = 5;
  SESSION_PHASE_SUSPENDED = 6;
  SESSION_PHASE_FINISHED = 7;
  SESSION_PHASE_FAILED = 8;
  SESSION_PHASE_RETRYING_PROVIDER = 9;
}

message Suspension {
  SuspensionKind kind = 1;
  repeated PendingWork work = 2;
  ExternalRequest request = 3;
}

enum SuspensionKind {
  SUSPENSION_KIND_UNSPECIFIED = 0;
  SUSPENSION_KIND_AWAITING_TOOL_RESULTS = 1;
  SUSPENSION_KIND_AWAITING_EXTERNAL_INPUT = 2;
  SUSPENSION_KIND_INTERRUPTED = 3;
}

message PendingWork {
  string id = 1;
  uint64 turn = 2;
  PendingWorkStatus status = 3;
}

enum PendingWorkStatus {
  PENDING_WORK_STATUS_UNSPECIFIED = 0;
  PENDING_WORK_STATUS_PENDING = 1;
  PENDING_WORK_STATUS_CANCELED = 2;
  PENDING_WORK_STATUS_FINISHED = 3;
  PENDING_WORK_STATUS_FAILED = 4;
}

message ExternalRequest {
  string id = 1;
  ExternalRequestKind kind = 2;
  optional string tool_call_id = 3;
  string prompt = 4;

  // JSON payload encoded as UTF-8 JSON until request payload protos stabilize.
  string payload_json = 5;
}

enum ExternalRequestKind {
  EXTERNAL_REQUEST_KIND_UNSPECIFIED = 0;
  EXTERNAL_REQUEST_KIND_PERMISSION = 1;
  EXTERNAL_REQUEST_KIND_QUESTION = 2;
  EXTERNAL_REQUEST_KIND_TOOL_INPUT = 3;
  EXTERNAL_REQUEST_KIND_CUSTOM = 4;
}
