syntax = "proto3";

package waltr.sandbox.v1;

// Worker-to-host connection, local or through an authenticated outbound binding.
service SandboxService {
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
}

message ConnectRequest {
  oneof body {
    Hello hello = 1;
    Prepared prepared = 2;
    Progress progress = 3;
    Completed completed = 4;
    WorkspaceResponse workspace_response = 5;
    WorkspaceExportAck workspace_export_ack = 6;
    McpStdioCatalogAck mcp_stdio_catalog_ack = 7;
    McpStdioOpened mcp_stdio_opened = 8;
    McpStdioFrame mcp_stdio_frame = 9;
    McpStdioTerminal mcp_stdio_terminal = 10;
  }
}

message ConnectResponse {
  oneof body {
    Prepare prepare = 1;
    Execute execute = 2;
    Cancel cancel = 3;
    WorkspaceRequest workspace_request = 4;
    WorkspaceExportControl workspace_export_control = 5;
    McpStdioCatalogUpdate mcp_stdio_catalog_update = 6;
    McpStdioOpen mcp_stdio_open = 7;
    McpStdioFrame mcp_stdio_frame = 8;
    McpStdioClose mcp_stdio_close = 9;
  }
}

// Only sent by the exporting server on its private worker stream.
message WorkspaceExportControl {
  string request_id = 1;
  string binding = 2;
  oneof change {
    WorkspaceExportApply apply = 3;
    WorkspaceExportAccess rotate = 4;
    WorkspaceExportRemove remove = 5;
  }
}

message WorkspaceExportApply {
  string endpoint = 1;
  string machine_id = 2;
  // Resolved on the exporting worker, not the controlling server.
  string export_root = 3;
  WorkspaceExportAccess access = 4;
  // Exporter-owned definitions for this binding alone. Never sent to the hosted peer.
  repeated McpStdioLaunch mcp_stdio_launches = 5;
}

message WorkspaceExportAccess {
  string access_token = 1;
  uint64 expires_at_unix = 2;
}

message WorkspaceExportRemove {}

// Correlated on the same private stream only. Rejections carry no input data.
message WorkspaceExportAck {
  string request_id = 1;
  bool applied = 2;
}

message Hello {
  string worker_id = 1;
  // The machine ID claimed by an outbound worker.
  string workspace_id = 2;
  uint64 generation = 3;
  repeated string tools = 4;
  // Canonical worker-local workspace root; never resolved on the host.
  string canonical_root = 5;
  // Private stream protocol. Zero means unavailable; the current version is 1.
  uint32 mcp_stdio_version = 6;
}

// Private platform types; none are part of the public MCP API.
message McpStdioLaunch {
  string name = 1;
  string executable = 2;
  repeated string arguments = 3;
}

// Only accepted from the private local host. Replaces the local catalog atomically.
// An empty list revokes all names. Await the ack before sending another update.
message McpStdioCatalogUpdate {
  string request_id = 1;
  repeated McpStdioLaunch launches = 2;
}

message McpStdioCatalogAck {
  string request_id = 1;
  // True after installing the replacement and joining any affected children.
  bool applied = 2;
}

message McpStdioOpen {
  // A canonical lowercase UUID, unique for the lifetime of this stream.
  string channel_id = 1;
  string server_name = 2;
  // A worker-validated export-relative directory; "." is the export root.
  string working_directory = 3;
}

message McpStdioOpened {
  string channel_id = 1;
  // False rejects the open without starting a channel. Wait for true to send frames.
  bool opened = 2;
}

message McpStdioFrame {
  string channel_id = 1;
  // One opaque LF-delimited stdio frame, without its delimiter, in either direction.
  // At most 1,048,448 payload bytes.
  bytes data = 2;
}

message McpStdioClose {
  string channel_id = 1;
}

enum McpStdioTerminalStatus {
  MCP_STDIO_TERMINAL_STATUS_UNSPECIFIED = 0;
  MCP_STDIO_TERMINAL_STATUS_CLOSED = 1;
  MCP_STDIO_TERMINAL_STATUS_EXITED = 2;
  MCP_STDIO_TERMINAL_STATUS_FAILED = 3;
  MCP_STDIO_TERMINAL_STATUS_REVOKED = 4;
}

// Ordered after the open ack and preceding frames on a live stream; never replayed.
message McpStdioTerminal {
  string channel_id = 1;
  McpStdioTerminalStatus status = 2;
  // True only after successful direct-child shutdown/reaping. False is not proof of cleanup.
  bool reaped = 3;
}

message Prepare {
  string invocation_id = 1;
  string tool_name = 2;
  string arguments_json = 3;
  // Present only for shell; these defaults belong to this invocation, not the workspace.
  ShellExecutionDefaults shell_defaults = 4;
  // Worker execution budget in milliseconds; zero uses the worker default.
  uint64 timeout_millis = 5;
  // Resolved export-relative session directory; absence uses the worker root.
  optional string working_directory = 6;
}

message ShellExecutionDefaults {
  string default_workdir = 1;
  uint64 default_timeout_seconds = 2;
  uint32 default_timeout_nanos = 3;
  uint64 max_output_bytes = 4;
}

message Claim {
  string operation = 1;
  string resource_kind = 2;
  string resource = 3;
}

message Prepared {
  string invocation_id = 1;
  repeated Claim claims = 2;
  string ticket = 3;
  string error = 4;
}

message Execute {
  string invocation_id = 1;
  string ticket = 2;
  // Worker execution budget in milliseconds; zero uses the worker default.
  uint64 timeout_millis = 3;
}

message Cancel {
  string invocation_id = 1;
}

message Progress {
  string invocation_id = 1;
  uint64 sequence = 2;
  string level = 3;
  string text = 4;
}

message ToolOutput {
  string content = 1;
  bool is_error = 2;
}

message Completed {
  string invocation_id = 1;
  ToolOutput output = 2;
  string error = 3;
}

message WorkspaceRequest {
  string request_id = 1;
  // resolve_working_directory validates path as an existing directory within
  // the export, expanding ~ on the worker. An empty path selects the export.
  string operation = 2;
  string path = 3;
  string pattern = 4;
  string include = 5;
  // Required for snapshot; zero is a valid bound (not an unlimited sentinel).
  uint32 max_entries = 6;
  uint32 max_depth = 7;
  uint32 max_bytes = 8;
  // Worker execution budget in milliseconds; zero uses the worker default.
  uint64 timeout_millis = 9;
  // Resolved export-relative base for read-only operations; absent at resolution.
  optional string working_directory = 10;
}

message WorkspaceResponse {
  string request_id = 1;
  string content = 2;
  repeated string entries = 3;
  string error = 4;
  // Populated for info/resolve; resolve may describe a path outside the workspace.
  string canonical_path = 5;
  // file, directory, or other.
  string path_kind = 6;
  string canonical_root = 7;
  // resolve_working_directory returns the canonical export root and this
  // directory relative to it ("." for the root), both in worker path syntax.
  optional string working_directory = 8;
}
