syntax = "proto3";

package waltr.config.v1;

message Configuration {
  reserved "runtime_defaults";

  map<string, Provider> providers = 1;
  string etag = 2;
  map<string, McpServer> mcp_servers = 3;
  InferenceDefaults inference_defaults = 4;
  SessionDictation session_dictation = 5;
}

message SessionDictation {
  string routine = 1;
  string trigger = 2;
  string input = 3;
  string output = 4;
}

message InferenceDefaults {
  reserved 3, 4;
  reserved "mcp_default_enabled", "enabled_mcp_server_keys";

  string provider_key = 1;
  string model_key = 2;
  optional string reasoning_effort = 5;
}

message Provider {
  ProviderType type = 1;
  string name = 2;
  string url = 3;
  map<string, string> headers = 4;
  map<string, Model> models = 5;
  bool oauth_compatible = 7;
  OAuthProvider oauth_settings = 8;
}

message OAuthProvider {
  string name = 1;
  string authorize_url = 2;
  string token_url = 3;
  string client_id = 4;
  string redirect_uri = 5;
  repeated string scopes = 6;
  OauthTokenRequestStyle token_request_style = 7;
  repeated OauthUrlParam auth_url_params = 8;
  repeated OauthJwtMetadata jwt_metadata = 9;
  bool send_state_in_token_request = 10;
}

message OauthUrlParam {
  string key = 1;
  string value = 2;
}

message OauthJwtMetadata {
  OauthTokenField token = 1;
  string metadata_key = 2;
  repeated string claim_names = 3;
  bool required = 4;
}

enum OauthTokenRequestStyle {
  OAUTH_TOKEN_REQUEST_STYLE_UNSPECIFIED = 0;
  OAUTH_TOKEN_REQUEST_STYLE_JSON = 1;
  OAUTH_TOKEN_REQUEST_STYLE_FORM_URLENCODED = 2;
}

enum OauthTokenField {
  OAUTH_TOKEN_FIELD_UNSPECIFIED = 0;
  OAUTH_TOKEN_FIELD_ACCESS = 1;
  OAUTH_TOKEN_FIELD_ID = 2;
}

enum ProviderType {
  PROVIDER_TYPE_UNSPECIFIED = 0;
  PROVIDER_TYPE_ANTHROPIC_MESSAGES = 1;
  PROVIDER_TYPE_OPENAI_CHAT_COMPLETIONS = 2;
  PROVIDER_TYPE_OPENAI_RESPONSES = 3;
  PROVIDER_TYPE_OPENAI_RESPONSES_WEBSOCKET = 4;
  PROVIDER_TYPE_GOOGLE_SPEECH_V2 = 5;
  PROVIDER_TYPE_GOOGLE_TEXT_TO_SPEECH_V1 = 6;
}

message Model {
  // Human-readable display name; map key is the stable id.
  string name = 1;
  ModelType type = 2;
  ModelOptions options = 3;
  ModelLimits limits = 4;
  ModelCapabilities capabilities = 5;
  ModelCatalogMatch catalog_match = 6;
  ModelCost cost = 7;
  SpeechRecognitionOptions recognition = 8;
  SpeechSynthesisOptions synthesis = 9;
  SpeechCapabilities speech_capabilities = 10;
}

// Explicit configuration only; speech models do not use models.dev defaults.
message SpeechRecognitionOptions {
  string recognizer = 1;
  string model = 2;
  repeated string language_codes = 3;
  uint32 sample_rate_hz = 4;
  uint32 channels = 5;
  bool interim_results = 6;
  bool automatic_punctuation = 7;
  // Opt-in cumulative streaming speaker attribution; disabled by default.
  bool diarization = 8;
}

message SpeechSynthesisOptions {
  string voice = 1;
  string language_code = 2;
  uint32 sample_rate_hz = 3;
  uint32 channels = 4;
  optional double speaking_rate = 5;
  optional double pitch = 6;
}

message SpeechCapabilities {
  bool unary = 1;
  bool streaming = 2;
}

message ModelCost {
  optional double input_per_million_tokens = 1;
  optional double output_per_million_tokens = 2;
  optional double cache_read_per_million_tokens = 3;
  optional double cache_write_per_million_tokens = 4;
  optional double image_input_per_million_tokens = 5;
  optional double image_input_per_image = 6;
  string currency = 7;
}

message ModelCatalogMatch {
  string provider_id = 1;
  string model_id = 2;
  optional string upstream_provider_id = 3;
  optional string upstream_model_id = 4;
  CatalogMatchSource source = 5;
}

enum CatalogMatchSource {
  CATALOG_MATCH_SOURCE_UNSPECIFIED = 0;
  CATALOG_MATCH_SOURCE_AUTO = 1;
  CATALOG_MATCH_SOURCE_MANUAL = 2;
  CATALOG_MATCH_SOURCE_APPLIED = 3;
}

// All option fields are optional; an absent field means "unset".
message ModelOptions {
  optional double temperature = 1;
  optional double top_p = 2;
  optional uint32 top_k = 3;
  optional double min_p = 4;
  optional double presence_penalty = 5;
  optional double repetition_penalty = 6;
  repeated string reasoning_efforts = 7;
}

message ModelLimits {
  optional uint32 context = 1;
  optional uint32 output = 2;
}

message ModelCapabilities {
  bool tools = 1;
  bool image = 2;
}

enum ModelType {
  MODEL_TYPE_UNSPECIFIED = 0;
  MODEL_TYPE_LLM = 1;
  MODEL_TYPE_EMBEDDING = 2;
  MODEL_TYPE_STT = 3;
  MODEL_TYPE_TTS = 4;
}

message McpServer {
  // Human-readable display name; map key is the stable id.
  string name = 1;
  McpServerType type = 2;
  // Required when type == MCP_SERVER_TYPE_STDIO.
  string command = 3;
  // Required when type == MCP_SERVER_TYPE_SSE.
  string url = 4;
}

enum McpServerType {
  MCP_SERVER_TYPE_UNSPECIFIED = 0;
  MCP_SERVER_TYPE_STDIO = 1;
  MCP_SERVER_TYPE_STREAMABLE_HTTP = 2;
}
