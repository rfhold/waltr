syntax = "proto3";

package waltr.config.v1;

service ConfigService {
  rpc PatchConfig(PatchConfigRequest) returns (PatchConfigResponse);
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc WatchConfig(WatchConfigRequest) returns (stream WatchConfigResponse);
}

message Configuration {
  map<string, Provider> providers = 1;
  string etag = 2;
  map<string, McpServer> mcp_servers = 3;
}

message Provider {
  ProviderType type = 1;
  string name = 2;
  string url = 3;
  map<string, string> headers = 4;
  map<string, Model> models = 5;
}

enum ProviderType {
  PROVIDER_TYPE_UNSPECIFIED = 0;
  PROVIDER_TYPE_ANTHROPIC = 1;
  PROVIDER_TYPE_OPENAI = 2;
}

message Model {
  // Human-readable display name; map key is the stable id.
  string name = 1;
  ModelType type = 2;
  ModelOptions options = 3;
  ModelLimits limits = 4;
  ModelCapabilities capabilities = 5;
}

// All option fields are optional; an absent field means "unset".
message ModelOptions {
  optional double temperature = 1;
  optional double top_p = 2;
  optional uint32 top_k = 3;
  optional double min_p = 4;
  optional double presence_penalty = 5;
  optional double repetition_penalty = 6;
}

message ModelLimits {
  optional uint32 context = 1;
  optional uint32 output = 2;
}

message ModelCapabilities {
  bool tools = 1;
  bool image = 2;
}

enum ModelType {
  MODEL_TYPE_UNSPECIFIED = 0;
  MODEL_TYPE_LLM = 1;
  MODEL_TYPE_EMBEDDING = 2;
  MODEL_TYPE_STT = 3;
  MODEL_TYPE_TTS = 4;
}

message McpServer {
  // Human-readable display name; map key is the stable id.
  string name = 1;
  McpServerType type = 2;
  // Required when type == MCP_SERVER_TYPE_STDIO.
  string command = 3;
  // Required when type == MCP_SERVER_TYPE_SSE.
  string url = 4;
}

enum McpServerType {
  MCP_SERVER_TYPE_UNSPECIFIED = 0;
  MCP_SERVER_TYPE_STDIO = 1;
  MCP_SERVER_TYPE_SSE = 2;
}

message PatchConfigRequest {
  string expected_etag = 1;
  ProviderMapPatch providers = 2;
  McpServerMapPatch mcp_servers = 3;
}

message ProviderMapPatch {
  map<string, Provider> providers = 1;
}

message McpServerMapPatch {
  map<string, McpServer> mcp_servers = 1;
}

message PatchConfigResponse {
  Configuration config = 1;
}

message GetConfigRequest {}

message GetConfigResponse {
  Configuration config = 1;
}

message WatchConfigRequest {}

message WatchConfigResponse {
  string previous_etag = 1;
  string etag = 2;
  repeated string changed_keys = 3;
  string error = 4;
  Configuration config = 5;
}
