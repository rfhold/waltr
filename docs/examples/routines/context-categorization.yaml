apiVersion: waltr.dev/v1alpha1
kind: Routine
metadata:
  name: context-categorization
spec:
  description: Incrementally assign session items to semantic context categories.
  triggers:
    - name: turn-batch
      sessionProgress:
        scope: session
        metric: completedTurns
        every: 20
        checkpoint: context.categorization
      when:
        - input: $(trigger.session.ephemeral)
          operator: In
          values:
            - "false"

    - name: delegated-task-batch
      sessionProgress:
        scope: session
        metric: completedToolCalls
        toolSelector:
          name: task
        every: 2
        checkpoint: context.categorization
      when:
        - input: $(trigger.session.ephemeral)
          operator: In
          values:
            - "false"

    - name: idle-flush
      sessionLifecycle:
        scope: session
        event: idle
        checkpoint: context.categorization
        onlyWithUnprocessedItems: true
      when:
        - input: $(trigger.session.ephemeral)
          operator: In
          values:
            - "false"

  concurrency:
    key: context-categorization/$(trigger.session.id)
    policy: coalesce
  sourceSession:
    from: $(trigger.session)
    snapshot:
      throughCursor: $(trigger.cursor)
  tasks:
    - name: read-state
      taskSpec:
        action:
          sessionMetadata:
            sessionId: $(sourceSession.session.id)
            read:
              - key: context.categorization
                default:
                  throughCursor: null
                  note: "No prior categorization note."
                  categories: []
                  assignments: []
        results:
          - name: state
            type: object
            value: $(action.sessionMetadata.values.context.categorization)

    - name: categorize
      runAfter:
        - read-state
      when:
        - input: $(tasks.read-state.results.state.throughCursor)
          operator: CursorBefore
          values:
            - $(sourceSession.snapshot.cursor)
      onSkip:
        results:
          - name: note
            type: string
            value: $(tasks.read-state.results.state.note)
      taskSpec:
        sessionTemplate:
          source:
            session: $(sourceSession.session)
            throughCursor: $(sourceSession.snapshot.cursor)
          masks:
            subtract:
              - all: true
            add:
              - type: filter
                selector:
                  afterCursor: $(tasks.read-state.results.state.throughCursor)
              - type: annotation
                timelineItemIds: true
          systemPrompt:
            mode: replace
            text: |
              Organize the copied session items into semantic context categories.
              A category represents one stage, phase, task, investigation, or
              other coherent work domain. Every copied item must be assigned to
              exactly one category key. Reuse a prior key when the work belongs
              to that domain and preserve its existing description verbatim;
              otherwise create a short stable key.

              Finish by calling organize-context exactly once. Do not continue
              the source task.
          userPrompt:
            text: |
              Prior short working note:
              $(tasks.read-state.results.state.note)

              Existing category definitions:
              $(tasks.read-state.results.state.categories)

              Categorize every copied item by its canonical item ID. Also return
              an updated short task-list-style note covering active work,
              immediate next work, and blockers that will help the next
              categorization pass.
        tools: []
        limits:
          maxTurns: 2
          maxToolCalls: 1
        captures:
          - name: organize-context
            description: Assign each copied item to one semantic category.
            schema:
              type: object
              additionalProperties: false
              required:
                - categories
                - assignments
                - note
              properties:
                categories:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - key
                      - description
                    properties:
                      key:
                        type: string
                        minLength: 1
                        maxLength: 64
                      description:
                        type: string
                        minLength: 1
                        maxLength: 240
                assignments:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - itemId
                      - categoryKey
                    properties:
                      itemId:
                        type: string
                        pattern: ^i[1-9][0-9]*$
                      categoryKey:
                        type: string
                note:
                  type: string
                  minLength: 1
                  maxLength: 2000
            minCalls: 1
            maxCalls: 1
            finishAfter: 1
        results:
          - name: categories
            type: array
            value: $(captures.organize-context[0].categories)
          - name: assignments
            type: array
            items:
              type: object
              additionalProperties: false
              required:
                - itemId
                - categoryKey
              properties:
                itemId:
                  type: string
                  pattern: ^i[1-9][0-9]*$
                categoryKey:
                  type: string
            value: $(captures.organize-context[0].assignments)
          - name: note
            type: string
            value: $(captures.organize-context[0].note)

    - name: save-state
      runAfter:
        - categorize
      when:
        - input: $(tasks.read-state.results.state.throughCursor)
          operator: CursorBefore
          values:
            - $(sourceSession.snapshot.cursor)
      taskSpec:
        action:
          sessionMetadata:
            sessionId: $(sourceSession.session.id)
            expected:
              key: context.categorization.throughCursor
              value: $(tasks.read-state.results.state.throughCursor)
              onMismatch: fail
            mutations:
              - operation: mergeByKey
                key: context.categorization.categories
                mergeKey: key
                onConflict: preserve
                value: $(tasks.categorize.results.categories)
              - operation: appendUnique
                key: context.categorization.assignments
                uniqueKey: itemId
                value: $(tasks.categorize.results.assignments)
              - operation: set
                key: context.categorization.note
                value: $(tasks.categorize.results.note)
              - operation: set
                key: context.categorization.throughCursor
                value: $(sourceSession.snapshot.cursor)
        results:
          - name: changed
            type: boolean
            value: $(action.sessionMetadata.changed)
  results:
    - name: through-cursor
      type: string
      value: $(sourceSession.snapshot.cursor)
    - name: note
      type: string
      value: $(tasks.categorize.results.note)
