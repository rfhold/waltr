# Desktop shortcuts; requires Computer Use MCP on the preview worker.
version: 1
keybinds:
  - id: dictate-type
    key: Ctrl+Alt+Space
    mode: hold
    routine:
      name: audio-transcribe
      trigger: dictate
      input: audio
      destination: home
    audio:
      device: default
      sampleRateHz: 24000
      channels: 1
  - id: dictate-cleanup-copy
    key: Ctrl+Alt+Super+Space
    mode: hold
    routine:
      name: audio-transcribe-cleanup
      trigger: dictate
      input: audio
      destination: home
    audio:
      device: default
      sampleRateHz: 24000
      channels: 1
