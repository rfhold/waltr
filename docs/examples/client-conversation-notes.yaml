# Copy final notes through Computer Use MCP on the preview worker.
version: 1
keybinds:
  - id: conversation-notes-copy
    key: Ctrl+Alt+Shift+Space
    mode: hold
    maxCaptureSeconds: 3600
    routine:
      name: audio-conversation-notes
      trigger: record-notes
      input: audio
      destination: home
    audio:
      device: default
      sampleRateHz: 24000
      channels: 1
