apiVersion: waltr.routine/v1
kind: Routine
name: screenshot-metadata
description: Apply deterministic session metadata for Routine browser screenshots.
spec:
  source: |
    export default async function () {
      const results = {};
      for (const key of ['screenshotReady', 'screenshotLayout']) {
        const snapshot = (await host.call('context.snapshot', {})).result;
        const change = (await host.call('context.transact', {
          source: snapshot.source,
          expectedRevision: snapshot.revision,
          predicates: [{key, value: {state: 'absent'}}],
          updates: [{key, value: {state: 'present', value: 'layout-verified'}}]
        })).result;
        if (!change.committed) throw new Error('metadata update was not committed');
        results[key] = change.committed;
      }
      return results;
    }
  entrypoints:
    manual:
      trigger: manual
  parameters:
    schemaVersion: waltr.value/v1
    schema:
      type: 'null'
  result:
    schemaVersion: waltr.value/v1
    schema:
      type: object
      properties:
        screenshotReady:
          type: boolean
        screenshotLayout:
          type: boolean
      required: [screenshotReady, screenshotLayout]
  capabilities:
    - context.snapshot
    - context.transact
