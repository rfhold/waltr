apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: waltr-preview
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push, incoming]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "2"
spec:
  taskRunSpecs:
    - pipelineTaskName: verify-infrastructure
      podTemplate:
        nodeSelector:
          kubernetes.io/arch: amd64
    - pipelineTaskName: deploy-preview
      podTemplate:
        nodeSelector:
          kubernetes.io/arch: amd64
  timeouts:
    pipeline: 2h0m0s
  params:
    - name: repo-url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: base-image
      value: "{{ CONTAINER_REGISTRY }}/{{ repo_owner }}/waltr"
  pipelineSpec:
    params:
      - name: repo-url
        type: string
      - name: revision
        type: string
      - name: base-image
        type: string
    workspaces:
      - name: source
    tasks:
      - name: fetch-repository
        retries: 1
        taskSpec:
          params:
            - name: repo-url
              type: string
            - name: revision
              type: string
          workspaces:
            - name: output
          volumes:
            - name: git-auth
              secret:
                secretName: "{{ git_auth_secret }}"
          steps:
            - name: clone
              image: docker.io/alpine/git:2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
              workingDir: $(workspaces.output.path)
              volumeMounts:
                - name: git-auth
                  mountPath: /etc/git-auth
                  readOnly: true
              script: |
                #!/bin/sh
                set -eu
                cp /etc/git-auth/.gitconfig /root/.gitconfig
                cp /etc/git-auth/.git-credentials /root/.git-credentials
                git clone "$(params.repo-url)" .
                git checkout --detach "$(params.revision)"
                test "`git rev-parse HEAD`" = "$(params.revision)"
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
        workspaces:
          - name: output
            workspace: source

      - name: verify-rust
        runAfter: [fetch-repository]
        retries: 1
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: test
              image: cr.holdenitdown.net/rfhold/general-ci:latest
              imagePullPolicy: Always
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                set -eu
                rustc --version | grep -q '^rustc 1\.96\.0 '
                rustfmt --version | grep -q '^rustfmt 1\.9\.0-'
                cargo fmt --all --check
                cargo test --locked -p mcp --features oauth-authorization-server-sqlite --test oauth_sqlite_store
                cargo test --locked -p waltr-server --tests
                cargo test --locked -p waltr-client --tests
        workspaces:
          - name: source
            workspace: source

      - name: verify-web
        runAfter: [fetch-repository]
        retries: 1
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: test
              image: cr.holdenitdown.net/rfhold/general-ci:latest
              imagePullPolicy: Always
              workingDir: $(workspaces.source.path)
              env:
                - name: CI
                  value: "true"
                - name: npm_config_cache
                  value: /tmp/npm-cache
              script: |
                #!/bin/sh
                set -eu
                test "`node --version`" = "v24.18.0"
                test "`pnpm --version`" = "11.5.0"
                pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true
                pnpm --filter @rfhold/waltr-web test
        workspaces:
          - name: source
            workspace: source

      - name: verify-infrastructure
        runAfter: [fetch-repository]
        retries: 1
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: build-and-test
              image: cr.holdenitdown.net/rfhold/general-ci:latest
              imagePullPolicy: Always
              workingDir: $(workspaces.source.path)/infra/pulumi
              script: |
                #!/bin/sh
                set -eu
                test "`bun --version`" = "1.3.5"
                test "`pulumi version`" = "v3.253.0"
                bun install --frozen-lockfile
                bun run build
                bun run test
        workspaces:
          - name: source
            workspace: source

      - name: scan-private-material
        runAfter: [fetch-repository]
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: scan
              image: docker.io/alpine/git:2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                set -eu
                if git grep -n -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}' -- infra/pulumi Dockerfile .tekton; then
                  echo "private credential material is tracked in deployment inputs" >&2
                  exit 1
                fi
        workspaces:
          - name: source
            workspace: source

      - name: build-amd64
        runAfter: [verify-rust, verify-web, verify-infrastructure, scan-private-material]
        retries: 1
        taskSpec:
          params:
            - name: image
              type: string
            - name: revision
              type: string
            - name: buildkit-addr
              type: string
          workspaces:
            - name: source
          steps:
            - name: build
              image: docker.io/moby/buildkit:v0.26.3@sha256:5601811fde88bb9e8a577bfe804af82bccb712e1cd07ff94663bded5e628cf75
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                set -eu
                buildctl --addr "tcp://$(params.buildkit-addr)" build \
                  --frontend dockerfile.v0 \
                  --local context=. \
                  --local dockerfile=. \
                  --opt filename=Dockerfile \
                  --opt target=runtime \
                  --opt platform=linux/amd64 \
                  --opt "build-arg:REVISION=$(params.revision)" \
                  --output "type=image,name=$(params.image),push=true"
        params:
          - name: image
            value: $(params.base-image):preview-$(params.revision)-amd64
          - name: revision
            value: $(params.revision)
          - name: buildkit-addr
            value: "{{ BUILDKIT_AMD64_ADDR }}"
        workspaces:
          - name: source
            workspace: source

      - name: build-arm64
        runAfter: [verify-rust, verify-web, verify-infrastructure, scan-private-material]
        retries: 1
        taskSpec:
          params:
            - name: image
              type: string
            - name: revision
              type: string
            - name: buildkit-addr
              type: string
          workspaces:
            - name: source
          steps:
            - name: build
              image: docker.io/moby/buildkit:v0.26.3@sha256:5601811fde88bb9e8a577bfe804af82bccb712e1cd07ff94663bded5e628cf75
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                set -eu
                buildctl --addr "tcp://$(params.buildkit-addr)" build \
                  --frontend dockerfile.v0 \
                  --local context=. \
                  --local dockerfile=. \
                  --opt filename=Dockerfile \
                  --opt target=runtime \
                  --opt platform=linux/arm64 \
                  --opt "build-arg:REVISION=$(params.revision)" \
                  --output "type=image,name=$(params.image),push=true"
        params:
          - name: image
            value: $(params.base-image):preview-$(params.revision)-arm64
          - name: revision
            value: $(params.revision)
          - name: buildkit-addr
            value: "{{ BUILDKIT_ARM64_ADDR }}"
        workspaces:
          - name: source
            workspace: source

      - name: create-manifest
        runAfter: [build-amd64, build-arm64]
        taskSpec:
          params:
            - name: base-image
              type: string
            - name: tag
              type: string
          steps:
            - name: create
              image: docker.io/mplatform/manifest-tool:alpine-v2.1.7@sha256:ebc7670e868e29759ec655bbf379a1909d03d7bb341966c585c692412020cc4f
              script: |
                #!/bin/sh
                set -eu
                manifest-tool push from-args \
                  --platforms linux/amd64,linux/arm64 \
                  --template "$(params.base-image):$(params.tag)-ARCH" \
                  --target "$(params.base-image):$(params.tag)"
        params:
          - name: base-image
            value: $(params.base-image)
          - name: tag
            value: preview-$(params.revision)

      - name: resolve-and-verify-image
        runAfter: [create-manifest]
        retries: 1
        taskSpec:
          params:
            - name: base-image
              type: string
            - name: tag
              type: string
            - name: revision
              type: string
          results:
            - name: image
              type: string
          steps:
            - name: verify
              image: gcr.io/go-containerregistry/crane:debug@sha256:54b27703e6c602fbd6f95712910e9c8d45d4361a59274bde38aeec943734e424
              script: |
                #!/busybox/sh
                set -eu
                tagged="$(params.base-image):$(params.tag)"
                digest="`crane digest "$tagged"`"
                case "$digest" in sha256:[0-9a-f][0-9a-f]*) ;; *) exit 1 ;; esac
                image="$(params.base-image)@$digest"
                config="`crane config "$image"`"
                printf '%s' "$config" | grep -Fq '"User":"65532:65532"'
                printf '%s' "$config" | grep -Fq '"org.opencontainers.image.revision":"$(params.revision)"'
                printf '%s' "$image" > "$(results.image.path)"
        params:
          - name: base-image
            value: $(params.base-image)
          - name: tag
            value: preview-$(params.revision)
          - name: revision
            value: $(params.revision)

      - name: deploy-preview
        runAfter: [resolve-and-verify-image]
        retries: 1
        taskSpec:
          params:
            - name: image
              type: string
          workspaces:
            - name: source
          volumes:
            - name: kubeconfig
              secret:
                secretName: tekton-cluster-kubeconfig
          steps:
            - name: preview-and-up
              image: cr.holdenitdown.net/rfhold/general-ci:latest
              imagePullPolicy: Always
              workingDir: $(workspaces.source.path)/infra/pulumi
              env:
                - name: KUBECONFIG
                  value: /etc/kubeconfig/kubeconfig
                - name: PULUMI_HOME
                  value: /tmp/pulumi-home
              envFrom:
                - secretRef:
                    name: pulumi-credentials
                - secretRef:
                    name: authentik-credentials
              volumeMounts:
                - name: kubeconfig
                  mountPath: /etc/kubeconfig
                  readOnly: true
              script: |
                #!/bin/sh
                set -eu
                test "`bun --version`" = "1.3.5"
                test "`pulumi version`" = "v3.253.0"
                bun install --frozen-lockfile
                pulumi preview --stack preview --diff --config "image=$(params.image)"
                pulumi up --stack preview --yes --skip-preview --config "image=$(params.image)"
        params:
          - name: image
            value: $(tasks.resolve-and-verify-image.results.image)
        workspaces:
          - name: source
            workspace: source
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteMany]
          storageClassName: shared-fs
          resources:
            requests:
              storage: 20Gi
