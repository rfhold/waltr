apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: waltr-release
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: 'event == "push" && target_branch.matches("^refs/tags/v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")'
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  taskRunSpecs:
    - pipelineTaskName: deploy-production
      podTemplate:
        nodeSelector:
          kubernetes.io/arch: amd64
  timeouts:
    pipeline: 2h0m0s
  params:
    - name: repo-url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: source-branch
      value: "{{ source_branch }}"
    - name: base-image
      value: "{{ CONTAINER_REGISTRY }}/{{ repo_owner }}/waltr"
  pipelineSpec:
    params:
      - name: repo-url
        type: string
      - name: revision
        type: string
      - name: source-branch
        type: string
      - name: base-image
        type: string
    workspaces:
      - name: source
    tasks:
      - name: fetch-repository
        retries: 1
        taskSpec:
          params:
            - name: repo-url
              type: string
            - name: revision
              type: string
          workspaces:
            - name: output
          volumes:
            - name: git-auth
              secret:
                secretName: "{{ git_auth_secret }}"
          steps:
            - name: clone
              image: docker.io/alpine/git:2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
              workingDir: $(workspaces.output.path)
              volumeMounts:
                - name: git-auth
                  mountPath: /etc/git-auth
                  readOnly: true
              script: |
                #!/bin/sh
                set -eu
                cp /etc/git-auth/.gitconfig /root/.gitconfig
                cp /etc/git-auth/.git-credentials /root/.git-credentials
                git clone "$(params.repo-url)" .
                git checkout --detach "$(params.revision)"
                test "`git rev-parse HEAD`" = "$(params.revision)"
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
        workspaces:
          - name: output
            workspace: source

      - name: validate-release
        runAfter: [fetch-repository]
        taskSpec:
          params:
            - name: revision
              type: string
            - name: source-branch
              type: string
          results:
            - name: tag
              type: string
          workspaces:
            - name: source
          volumes:
            - name: trusted-signers
              secret:
                secretName: release-trusted-signers
          steps:
            - name: policy
              image: docker.io/alpine/git:2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
              workingDir: $(workspaces.source.path)
              env:
                - name: SOURCE_BRANCH
                  value: $(params.source-branch)
              volumeMounts:
                - name: trusted-signers
                  mountPath: /etc/release-signers
                  readOnly: true
              script: |
                #!/bin/sh
                set -eu
                case "$SOURCE_BRANCH" in refs/tags/v*) tag="${SOURCE_BRANCH#refs/tags/}" ;; *) exit 1 ;; esac
                printf '%s\n' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
                printf '%s\n' "$(params.revision)" | grep -Eq '^[0-9a-f]{40}$'
                export GNUPGHOME=/tmp/release-gnupg
                install -d -m 700 "$GNUPGHOME"
                gpg --batch --no-autostart --import /etc/release-signers/signing-key.asc
                test "`git rev-parse "refs/tags/$tag^{commit}"`" = "$(params.revision)"
                git merge-base --is-ancestor "$(params.revision)" refs/remotes/origin/main
                git verify-tag "$tag"
                printf '%s' "$tag" > "$(results.tag.path)"
        params:
          - name: revision
            value: $(params.revision)
          - name: source-branch
            value: $(params.source-branch)
        workspaces:
          - name: source
            workspace: source

      - name: scan-private-material
        runAfter: [fetch-repository]
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: scan
              image: docker.io/alpine/git:2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                set -eu
                if git grep -n -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}' -- infra/pulumi Dockerfile .tekton; then
                  echo "private credential material is tracked in deployment inputs" >&2
                  exit 1
                fi
        workspaces:
          - name: source
            workspace: source

      - name: build-amd64
        runAfter: [validate-release, scan-private-material]
        retries: 1
        taskSpec:
          params:
            - name: image
              type: string
            - name: worker-image
              type: string
            - name: revision
              type: string
            - name: buildkit-addr
              type: string
          workspaces:
            - name: source
          steps:
            - name: build
              image: docker.io/moby/buildkit:v0.26.3@sha256:5601811fde88bb9e8a577bfe804af82bccb712e1cd07ff94663bded5e628cf75
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                set -eu
                buildctl --addr "tcp://$(params.buildkit-addr)" build \
                  --frontend dockerfile.v0 --local context=. --local dockerfile=. \
                  --opt filename=Dockerfile --opt target=runtime --opt platform=linux/amd64 \
                  --opt "build-arg:REVISION=$(params.revision)" \
                  --output "type=image,name=$(params.image),push=true"
                buildctl --addr "tcp://$(params.buildkit-addr)" build \
                  --frontend dockerfile.v0 --local context=. --local dockerfile=. \
                  --opt filename=Dockerfile --opt target=worker-runtime --opt platform=linux/amd64 \
                  --opt "build-arg:REVISION=$(params.revision)" \
                  --output "type=image,name=$(params.worker-image),push=true"
        params:
          - name: image
            value: $(params.base-image):sha-$(params.revision)-amd64
          - name: worker-image
            value: $(params.base-image)-worker:sha-$(params.revision)-amd64
          - name: revision
            value: $(params.revision)
          - name: buildkit-addr
            value: "{{ BUILDKIT_AMD64_ADDR }}"
        workspaces:
          - name: source
            workspace: source

      - name: build-arm64
        runAfter: [validate-release, scan-private-material]
        retries: 1
        taskSpec:
          params:
            - name: image
              type: string
            - name: worker-image
              type: string
            - name: revision
              type: string
            - name: buildkit-addr
              type: string
          workspaces:
            - name: source
          steps:
            - name: build
              image: docker.io/moby/buildkit:v0.26.3@sha256:5601811fde88bb9e8a577bfe804af82bccb712e1cd07ff94663bded5e628cf75
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                set -eu
                buildctl --addr "tcp://$(params.buildkit-addr)" build \
                  --frontend dockerfile.v0 --local context=. --local dockerfile=. \
                  --opt filename=Dockerfile --opt target=runtime --opt platform=linux/arm64 \
                  --opt "build-arg:REVISION=$(params.revision)" \
                  --output "type=image,name=$(params.image),push=true"
                buildctl --addr "tcp://$(params.buildkit-addr)" build \
                  --frontend dockerfile.v0 --local context=. --local dockerfile=. \
                  --opt filename=Dockerfile --opt target=worker-runtime --opt platform=linux/arm64 \
                  --opt "build-arg:REVISION=$(params.revision)" \
                  --output "type=image,name=$(params.worker-image),push=true"
        params:
          - name: image
            value: $(params.base-image):sha-$(params.revision)-arm64
          - name: worker-image
            value: $(params.base-image)-worker:sha-$(params.revision)-arm64
          - name: revision
            value: $(params.revision)
          - name: buildkit-addr
            value: "{{ BUILDKIT_ARM64_ADDR }}"
        workspaces:
          - name: source
            workspace: source

      - name: create-source-manifest
        runAfter: [build-amd64, build-arm64]
        taskSpec:
          params:
            - name: base-image
              type: string
            - name: worker-base-image
              type: string
            - name: tag
              type: string
          steps:
            - name: create
              image: docker.io/mplatform/manifest-tool:alpine-v2.1.7@sha256:ebc7670e868e29759ec655bbf379a1909d03d7bb341966c585c692412020cc4f
              script: |
                #!/bin/sh
                set -eu
                manifest-tool push from-args \
                  --platforms linux/amd64,linux/arm64 \
                  --template "$(params.base-image):$(params.tag)-ARCH" \
                  --target "$(params.base-image):$(params.tag)"
                manifest-tool push from-args \
                  --platforms linux/amd64,linux/arm64 \
                  --template "$(params.worker-base-image):$(params.tag)-ARCH" \
                  --target "$(params.worker-base-image):$(params.tag)"
        params:
          - name: base-image
            value: $(params.base-image)
          - name: worker-base-image
            value: $(params.base-image)-worker
          - name: tag
            value: sha-$(params.revision)

      - name: promote-release
        runAfter: [create-source-manifest]
        retries: 1
        taskSpec:
          params:
            - name: base-image
              type: string
            - name: worker-base-image
              type: string
            - name: source-tag
              type: string
            - name: release-tag
              type: string
            - name: revision
              type: string
          results:
            - name: image
              type: string
            - name: worker-image
              type: string
          steps:
            - name: promote-and-verify
              image: gcr.io/go-containerregistry/crane:debug@sha256:54b27703e6c602fbd6f95712910e9c8d45d4361a59274bde38aeec943734e424
              script: |
                #!/busybox/sh
                set -eu
                verify_source() {
                  base="$1"
                  digest="`crane digest "$base:$(params.source-tag)"`"
                  printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
                  immutable="$base@$digest"
                  for platform in linux/amd64 linux/arm64; do
                    config="`crane config --platform "$platform" "$immutable"`"
                    printf '%s' "$config" | grep -Fq '"User":"65532:65532"'
                    printf '%s' "$config" | grep -Fq '"org.opencontainers.image.revision":"$(params.revision)"'
                  done
                }
                verify_source "$(params.base-image)"
                server_digest="$digest"
                server_immutable="$immutable"
                verify_source "$(params.worker-base-image)"
                worker_digest="$digest"
                worker_immutable="$immutable"

                check_release() {
                  if response="`crane digest "$1" 2>&1`"; then
                    test "$response" = "$2"
                    release_missing=false
                  else
                    case "$response" in
                      *MANIFEST_UNKNOWN*|*NAME_UNKNOWN*|*'404 Not Found'*) release_missing=true ;;
                      *) printf '%s\n' "$response" >&2; return 1 ;;
                    esac
                  fi
                }
                server_release="$(params.base-image):$(params.release-tag)"
                worker_release="$(params.worker-base-image):$(params.release-tag)"
                check_release "$server_release" "$server_digest"
                check_release "$worker_release" "$worker_digest"

                promote() {
                  check_release "$2" "$3"
                  if [ "$release_missing" = true ]; then
                    crane copy "$1" "$2"
                  fi
                  test "`crane digest "$2"`" = "$3"
                }
                promote "$server_immutable" "$server_release" "$server_digest"
                promote "$worker_immutable" "$worker_release" "$worker_digest"
                test "`crane digest "$server_release"`" = "$server_digest"
                test "`crane digest "$worker_release"`" = "$worker_digest"
                printf '%s' "$server_immutable" > "$(results.image.path)"
                printf '%s' "$worker_immutable" > "$(results.worker-image.path)"
        params:
          - name: base-image
            value: $(params.base-image)
          - name: worker-base-image
            value: $(params.base-image)-worker
          - name: source-tag
            value: sha-$(params.revision)
          - name: release-tag
            value: $(tasks.validate-release.results.tag)
          - name: revision
            value: $(params.revision)

      - name: deploy-production
        runAfter: [promote-release]
        retries: 1
        taskSpec:
          params:
            - name: image
              type: string
            - name: worker-image
              type: string
          workspaces:
            - name: source
          volumes:
            - name: kubeconfig
              secret:
                secretName: tekton-cluster-kubeconfig
          steps:
            - name: preview-and-up
              image: cr.holdenitdown.net/rfhold/general-ci:latest
              imagePullPolicy: Always
              workingDir: $(workspaces.source.path)/infra/pulumi
              env:
                - name: KUBECONFIG
                  value: /etc/kubeconfig/kubeconfig
                - name: PULUMI_HOME
                  value: /tmp/pulumi-home
              envFrom:
                - secretRef:
                    name: pulumi-credentials
                - secretRef:
                    name: authentik-credentials
              volumeMounts:
                - name: kubeconfig
                  mountPath: /etc/kubeconfig
                  readOnly: true
              script: |
                #!/bin/sh
                set -eu
                test "`bun --version`" = "1.3.5"
                test "`pulumi version`" = "v3.253.0"
                bun install --frozen-lockfile
                pulumi preview --stack prod --diff --config "image=$(params.image)" --config "workerImage=$(params.worker-image)"
                pulumi up --stack prod --yes --skip-preview --config "image=$(params.image)" --config "workerImage=$(params.worker-image)"
        params:
          - name: image
            value: $(tasks.promote-release.results.image)
          - name: worker-image
            value: $(tasks.promote-release.results.worker-image)
        workspaces:
          - name: source
            workspace: source
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteMany]
          storageClassName: shared-fs
          resources:
            requests:
              storage: 20Gi
