version: v2
plugins:
  - local: protoc-gen-prost
    out: crates/waltr/src/grpc
    opt:
      - type_attribute=.waltr.config.v1=#[derive(serde::Serialize\, serde::Deserialize)]
      - type_attribute=.waltr.status.v1=#[derive(serde::Serialize\, serde::Deserialize)]
      - field_attribute=.waltr.config.v1.ModelOptions.reasoning_efforts=#[serde(default)]
  - local: protoc-gen-tonic
    out: crates/waltr/src/grpc
    opt: [no_transport=true]
