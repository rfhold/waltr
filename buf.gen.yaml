version: v2
plugins:
  - local: protoc-gen-prost
    out: crates/waltr/src/grpc
    opt:
      - disable_comments=.google
      - type_attribute=.waltr.config.v1=#[derive(serde::Serialize\, serde::Deserialize)]
      - type_attribute=.waltr.status.v1=#[derive(serde::Serialize\, serde::Deserialize)]
      - skip_debug=.waltr.sandbox.v1.WorkspaceExportApply
      - skip_debug=.waltr.sandbox.v1.WorkspaceExportAccess
      - skip_debug=.waltr.session.v1.UserMessageInputPart
      - skip_debug=.waltr.session.v1.BeginMessageImageUploadResponse
      - skip_debug=.waltr.session.v1.WriteMessageImageChunkRequest
      - skip_debug=.waltr.session.v1.SealMessageImageUploadRequest
      - skip_debug=.waltr.session.v1.AbortMessageImageUploadRequest
      - skip_debug=.waltr.session.v1.ReadMessageImageResponse
      - type_attribute=.waltr.session.v1.ProjectedTimelineEvent=#[derive(Eq\, Hash)]
      - type_attribute=.waltr.session.v1.SyntheticTimelineEvent=#[derive(Eq\, Hash)]
      - type_attribute=.waltr.session.v1.TimelineEvent=#[derive(Eq\, Hash)]
      - type_attribute=.waltr.session.v1.TimelineContent=#[derive(Eq\, Hash)]
      - type_attribute=.waltr.session.v1.UserMessageTimelineContent=#[derive(Eq\, Hash)]
      - type_attribute=.waltr.session.v1.SubmitUserMessageRequest=#[derive(Eq\, Hash)]
      - field_attribute=.waltr.config.v1.ModelOptions.reasoning_efforts=#[serde(default)]
      - field_attribute=.waltr.config.v1.SpeechRecognitionOptions.diarization=#[serde(default)]
  - local: protoc-gen-tonic
    out: crates/waltr/src/grpc
    opt: [no_transport=true]
