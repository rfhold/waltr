services:
  waltr:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WALTR_SERVER_WEB_IMAGE:-waltr-server-web:local}
    environment:
      WALTR_SERVER_ADDR: 0.0.0.0:14333
      WALTR_AUTH_PATH: ${WALTR_AUTH_PATH:-/data/auth.json}
      WALTR_SESSION_FILESYSTEM_ROOT: ${WALTR_SESSION_FILESYSTEM_ROOT:-/data/sessions}
      WALTR_SESSION_STORE: ${WALTR_SESSION_STORE:-filesystem}
      WALTR_MCP_OAUTH_CLIENT_ID: ${WALTR_MCP_OAUTH_CLIENT_ID:-waltr-test}
      WALTR_MCP_OAUTH_REDIRECT_URI: ${WALTR_MCP_OAUTH_REDIRECT_URI:-http://waltr:14333/oauth/callback}
    env_file:
      - path: ${WALTR_COMPOSE_ENV_FILE:-./.dev/compose.env}
        required: false
    ports:
      - "${WALTR_SERVER_WEB_PORT:-14333}:14333"
    volumes:
      - ${WALTR_DATA_ROOT:-waltr-data}:/data

  k6:
    profiles:
      - test
    image: grafana/k6:1.3.0-with-browser
    depends_on:
      - waltr
      - dex
      - mcp
    working_dir: /workspace
    environment:
      K6_BROWSER_HEADLESS: ${K6_BROWSER_HEADLESS:-true}
      WALTR_WEB_BASE_URL: http://waltr:14333
      WALTR_WEB_SCREENSHOTS: ${WALTR_WEB_SCREENSHOTS:-0}
      WALTR_WEB_SCREENSHOTS_DIR: /screenshots
      WALTR_AGENT_LIVE_GATEWAY: ${WALTR_AGENT_LIVE_GATEWAY:-0}
      WALTR_OAUTH_AUTH_URL: ${WALTR_OAUTH_AUTH_URL:-}
      WALTR_OAUTH_ISSUER: ${WALTR_OAUTH_ISSUER:-http://dex:5556/dex}
      WALTR_OAUTH_CLIENT_ID: ${WALTR_OAUTH_CLIENT_ID:-waltr-test}
      WALTR_OAUTH_REDIRECT_URI: ${WALTR_OAUTH_REDIRECT_URI:-http://127.0.0.1/oauth/callback}
      WALTR_OAUTH_USERNAME: ${WALTR_OAUTH_USERNAME:-waltr@example.test}
      WALTR_OAUTH_PASSWORD: ${WALTR_OAUTH_PASSWORD:-password}
    volumes:
      - .:/workspace:ro
      - ${WALTR_WEB_SCREENSHOTS_HOST_DIR:-/tmp/waltr-web-screenshots}:/screenshots:rw

  dex:
    profiles:
      - test
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "${WALTR_DEX_PORT:-5556}:5556"
    volumes:
      - ./tests/web/k6/support/dex-config.yaml:/etc/dex/config.yaml:ro

  mcp:
    profiles:
      - test
    image: ${WALTR_SERVER_WEB_IMAGE:-waltr-server-web:local}
    command: ["waltr-agent-test-mcp-server", "--http", "0.0.0.0:14666"]
    depends_on:
      - dex
    environment:
      WALTR_TEST_MCP_OAUTH_ISSUER: ${WALTR_MCP_OAUTH_ISSUER:-http://dex:5556/dex}
      WALTR_TEST_MCP_OAUTH_CLIENT_ID: ${WALTR_MCP_OAUTH_CLIENT_ID:-waltr-test}
      WALTR_TEST_MCP_RESOURCE: http://mcp:14666/mcp

volumes:
  waltr-data:
