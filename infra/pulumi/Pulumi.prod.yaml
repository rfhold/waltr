config:
  kubernetes:context: pantheon
  waltr:namespace: waltr
  waltr:hostname: waltr.holdenitdown.net
  waltr:appsHostname: waltr-apps.holdenitdown.net
  waltr:displayName: Waltr
  waltr:slug: waltr
  waltr:authentikBaseUrl: https://auth.holdenitdown.net
  waltr:androidNativeRedirectUri: dev.waltr.app:/oauth2redirect
  waltr:protectData: true
  waltr:dataStorageSize: 10Gi
  waltr:workspaceStorageSize: 10Gi
  waltr:databaseStorageSize: 20Gi
  waltr:storageClass: shared-fs
  waltr:bucketStorageClass: default-bucket
  waltr:s3Endpoint: https://s3.pantheon.holdenitdown.net
  waltr:s3Prefix: production/sessions
  waltr:apiAudience: waltr-api
  waltr:apiScope: waltr:use
  waltr:mcpScope: mcp:use
  waltr:mcpOutboundOAuthTrustedPrivateOrigins:
    - https://homelab-mcp.holdenitdown.net
    - https://smarthome-mcp.holdenitdown.net
    - https://re-search.holdenitdown.net
    - https://faktory.holdenitdown.net
    - https://axol.holdenitdown.net
  waltr:mcpOAuthAccessTokenTtl: "259200"
  waltr:mcpOAuthRefreshTokenTtl: "86400"
  waltr:mcpOAuthRefreshFamilyTtl: "2592000"
  waltr:mcpOAuthCodeTtl: "300"
  waltr:mcpOAuthAllowDcr: true
  waltr:mcpOAuthAllowLoopbackRedirects: true
  waltr:mcpOAuthAllowCimd: true
  waltr:mcpOAuthWrappingKeyVersions: [v1]
  waltr:mcpOAuthActiveWrappingKeyVersion: v1
